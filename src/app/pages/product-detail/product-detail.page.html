<ion-header>
  <div style="background-color: #3880ff; padding: 12px 20px; display: flex; align-items: center; gap: 15px; color: #fff;">
    <button type="button" (click)="goBack()" style="background: rgba(255,255,255,0.2); border: 1px solid #fff; color: #fff; padding: 6px 14px; border-radius: 6px; font-weight: bold; cursor: pointer;">
      ⬅ กลับหน้าหลัก
    </button>
    <div style="font-size: 18px; font-weight: bold;">หน้ารายละเอียดสินค้า</div>
  </div>
</ion-header>

<ion-content class="ion-padding" style="--background: #f8f9fa;">
  <div *ngIf="product" style="max-width: 750px; margin: 20px auto; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.08); padding: 20px;">
    <img [src]="product.image_url" [alt]="product.name" style="width: 100%; height: 320px; object-fit: cover; border-radius: 8px;" />
    
    <div style="margin-top: 20px;">
      <span style="background: #ffc409; color: #000; padding: 4px 12px; border-radius: 4px; font-weight: bold; font-size: 13px;">
        {{ product.category }}
      </span>
      <h2 style="font-size: 22px; font-weight: bold; margin: 12px 0 6px; color: #222;">{{ product.name }}</h2>
      <h3 style="font-size: 20px; font-weight: bold; color: #e53935; margin: 0 0 16px;">{{ product.price | number:'1.2-2' }} บาท</h3>
      
      <div style="border-top: 1px solid #eee; border-bottom: 1px solid #eee; padding: 14px 0; margin-bottom: 20px;">
        <h4 style="margin: 0 0 8px; color: #333;">คุณสมบัติและคำอธิบาย:</h4>
        <p style="color: #666; line-height: 1.6; margin: 0 0 10px;">{{ product.description }}</p>
        <ul style="color: #555; line-height: 1.8; margin: 0; padding-left: 20px;">
          <li>คัดสรรวัตถุดิบชั้นดี มีคุณค่าทางโภชนาการครบถ้วน</li>
          <li>สินค้าของแท้ 100% มีการรับประกันคุณภาพ</li>
          <li>พร้อมจัดส่งด่วนทั่วประเทศ</li>
        </ul>
      </div>

      <button type="button" (click)="buyNow()" style="width: 100%; padding: 14px; background: #2dd36f; color: #ffffff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer;">
        🛒 ยืนยันการสั่งซื้อสินค้านี้
      </button>
    </div>
  </div>
</ion-content>
