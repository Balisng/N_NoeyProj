<ion-header>
  <div style="display: flex; justify-content: space-between; align-items: center; background-color: #3880ff; padding: 12px 20px; color: #ffffff;">
    <div style="font-size: 18px; font-weight: bold;">
      🐾 ร้านขายอาหารสัตว์ (Pet Food Store)
    </div>
    <div style="display: flex; gap: 10px;">
      <button type="button" (click)="goToContact()" style="background-color: #ffffff; color: #3880ff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer;">
        ✉ ติดต่อเรา
      </button>
      <button type="button" (click)="logout()" style="background-color: rgba(255,255,255,0.2); color: #ffffff; border: 1px solid #ffffff; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer;">
        🚪 ออกจากระบบ
      </button>
    </div>
  </div>
</ion-header>

<ion-content class="ion-padding" style="--background: #f4f6f9;">
  <div style="background: #ffffff; padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; font-size: 15px;">
    ผู้ใช้งานปัจจุบัน: <strong>{{ currentUser?.username || 'admin' }}</strong>
  </div>

  <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px;">
    <div *ngFor="let item of products" style="background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,0.08); display: flex; flex-direction: column; justify-content: space-between;">
      <div style="position: relative; height: 180px; cursor: pointer;" (click)="viewDetail(item)">
        <img [src]="item.image_url" [alt]="item.name" style="width: 100%; height: 100%; object-fit: cover;" />
        <span style="position: absolute; top: 10px; left: 10px; background: #ffc409; color: #000; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold;">
          {{ item.category }}
        </span>
      </div>

      <div style="padding: 16px; display: flex; flex-direction: column; flex-grow: 1;">
        <h3 style="font-size: 16px; font-weight: bold; margin: 0 0 6px; color: #222; cursor: pointer;" (click)="viewDetail(item)">
          {{ item.name }}
        </h3>
        <div style="font-size: 16px; font-weight: bold; color: #e53935; margin-bottom: 8px;">
          {{ item.price | number:'1.2-2' }} บาท
        </div>
        <p style="font-size: 13px; color: #666; line-height: 1.4; margin-bottom: 16px; flex-grow: 1;">
          {{ item.description }}
        </p>

        <div style="display: flex; flex-direction: column; gap: 8px;">
          <!-- ปุ่มดูรายละเอียด -->
          <button type="button" (click)="viewDetail(item)" style="width: 100%; padding: 10px; border: 1.5px solid #3880ff; background: #ffffff; color: #3880ff; border-radius: 6px; font-weight: bold; cursor: pointer;">
            🔍 ดูรายละเอียด
          </button>
          <!-- ปุ่มสั่งซื้อ -->
          <button type="button" (click)="buyProduct(item)" style="width: 100%; padding: 10px; border: none; background: #2dd36f; color: #ffffff; border-radius: 6px; font-weight: bold; cursor: pointer;">
            🛒 สั่งซื้อสินค้า
          </button>
        </div>
      </div>
    </div>
  </div>
</ion-content>
